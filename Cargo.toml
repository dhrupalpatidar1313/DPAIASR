[package]
name = "DPAIASR"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1"
cpal = "0.15"
ctrlc = "3"
crossbeam-channel = "0.5"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "dpaiasr"
path = "src/lib.rs"
